services:
  server:
    build:
      context: .
    restart: unless-stopped
    environment:
      TRANSITOS_HOST: 0.0.0.0
      TRANSITOS_PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRANSITOS_DOMAIN: ${TRANSITOS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
