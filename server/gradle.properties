# The server is a standalone Gradle build (see ../docs/multi-operator.md). It is
# deliberately decoupled from the Android build so the JVM/Ktor build never drags
# in AGP.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
