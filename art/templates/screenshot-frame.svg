<svg xmlns="http://www.w3.org/2000/svg" width="{{W}}" height="{{H}}" viewBox="0 0 {{W}} {{H}}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#0B5F5D"/>
      <stop offset="50%" stop-color="#063634"/>
      <stop offset="100%" stop-color="#02191A"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.88" cy="0.06" r="0.72">
      <stop offset="0%" stop-color="#3ED3C7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#3ED3C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.05" cy="1.02" r="0.6">
      <stop offset="0%" stop-color="#F5C55A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5C55A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deviceGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2FD0C4" stop-opacity="0.26"/>
      <stop offset="70%" stop-color="#2FD0C4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2FD0C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C55A"/>
      <stop offset="45%" stop-color="#3ED3C7"/>
      <stop offset="100%" stop-color="#3ED3C7" stop-opacity="0"/>
    </linearGradient>
    <filter id="deviceShadow" x="-40%" y="-25%" width="180%" height="160%">
      <feDropShadow dx="0" dy="{{SHADOW_DY}}" stdDeviation="{{SHADOW_BLUR}}" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="{{W}}" height="{{H}}" fill="url(#bg)"/>
  <rect width="{{W}}" height="{{H}}" fill="url(#glowTeal)"/>
  <rect width="{{W}}" height="{{H}}" fill="url(#glowAmber)"/>

  <!-- Network texture in the free bands -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-linecap="round" stroke-width="{{MOTIF_SW}}">
    <path d="{{MOTIF1}}"/>
    <path d="{{MOTIF2}}"/>
    <path d="{{MOTIF3}}"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.10">
    {{MOTIF_DOTS}}
  </g>

  <rect width="{{W}}" height="{{TOP_LINE_H}}" fill="url(#topLine)"/>

  <!-- Giant step watermark -->
  <text x="{{STEP_X}}" y="{{STEP_Y}}" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{STEP_SIZE}}" font-weight="800" fill="#FFFFFF" opacity="0.06" letter-spacing="-6">{{STEP}}</text>

  <!-- Localized caption -->
  <rect x="{{CAP_X}}" y="{{EYEBROW_Y}}" width="{{EYEBROW_W}}" height="{{EYEBROW_H}}" rx="{{EYEBROW_R}}" fill="{{ACCENT}}"/>
  <text x="{{CAP_X}}" y="{{CAP_Y1}}" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{HEADLINE_SIZE}}" font-weight="700" fill="#FFFFFF" letter-spacing="-0.6">{{HEADLINE1}}</text>
  <text x="{{CAP_X}}" y="{{CAP_Y2}}" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{HEADLINE_SIZE}}" font-weight="700" fill="#FFFFFF" letter-spacing="-0.6">{{HEADLINE2}}</text>
  <text x="{{CAP_X}}" y="{{SUB_Y1}}" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{SUB_SIZE}}" font-weight="400" fill="#9FE0DA">{{SUB1}}</text>
  <text x="{{CAP_X}}" y="{{SUB_Y2}}" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{SUB_SIZE}}" font-weight="400" fill="#9FE0DA">{{SUB2}}</text>

  <!-- Device slot -->
  <ellipse cx="{{DEV_CX}}" cy="{{DEV_CY}}" rx="{{DEV_RX}}" ry="{{DEV_RY}}" fill="url(#deviceGlow)"/>
  <rect x="{{BEZEL_X}}" y="{{BEZEL_Y}}" width="{{BEZEL_W}}" height="{{BEZEL_H}}" rx="{{BEZEL_R}}" fill="#04100F" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="{{BORDER_SW}}" filter="url(#deviceShadow)"/>

  <!-- Footer -->
  {{LOGO}}
  <text x="{{FOOT_TEXT_X}}" y="{{FOOT_BASELINE}}" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{FOOTER_SIZE}}" font-weight="700" fill="#FFFFFF">{{APP_NAME}}</text>
  <text x="{{FOOT_TAG_X}}" y="{{FOOT_BASELINE}}" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="{{FOOTER_SIZE}}" font-weight="400" fill="#FFFFFF" fill-opacity="0.5">{{TAGLINE}}</text>

  <rect width="{{W}}" height="{{H}}" filter="url(#grain)" opacity="0.5"/>
</svg>
