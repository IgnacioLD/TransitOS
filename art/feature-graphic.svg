<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005555"/>
      <stop offset="100%" stop-color="#003535"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006A6A"/>
      <stop offset="100%" stop-color="#004040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="125" x2="1024" y2="125"/>
    <line x1="0" y1="250" x2="1024" y2="250"/>
    <line x1="0" y1="375" x2="1024" y2="375"/>
    <line x1="256" y1="0" x2="256" y2="500"/>
    <line x1="512" y1="0" x2="512" y2="500"/>
    <line x1="768" y1="0" x2="768" y2="500"/>
  </g>

  <!-- Accent circles -->
  <circle cx="100" cy="80" r="300" fill="#006A6A" opacity="0.15"/>
  <circle cx="924" cy="420" r="200" fill="#006A6A" opacity="0.1"/>

  <!-- Icon - centered top area -->
  <g transform="translate(80, 70)">
    <rect width="140" height="140" rx="34" fill="url(#iconBg)"/>
    <path d="M26,40 Q26,30 35,30 L105,30 Q114,30 114,40 L114,88 Q114,93 109,93 L31,93 Q26,93 26,88 Z" fill="#FFFFFF"/>
    <path d="M32,42 L108,42 L108,62 Q108,66 104,66 L36,66 Q32,66 32,62 Z" fill="#1B4332"/>
    <rect x="50" y="42" width="6" height="24" fill="#FFFFFF"/>
    <rect x="84" y="42" width="6" height="24" fill="#FFFFFF"/>
    <circle cx="38" cy="81" r="6" fill="#FFD700"/>
    <circle cx="102" cy="81" r="6" fill="#FFD700"/>
    <path d="M31,93 L109,93 L109,97 Q109,101 105,101 L35,101 Q31,101 31,97 Z" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="240" y="120" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">TransitOS</text>

  <!-- Tagline -->
  <text x="240" y="165" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" fill-opacity="0.65">Real-time public transport planner</text>

  <!-- Feature pills -->
  <g transform="translate(240, 195)" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.8">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="60" y="21" text-anchor="middle">Open source</text>

    <rect x="130" y="0" width="100" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="180" y="21" text-anchor="middle">No tracking</text>

    <rect x="240" y="0" width="80" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="280" y="21" text-anchor="middle">No ads</text>

    <rect x="330" y="0" width="150" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="405" y="21" text-anchor="middle">Metrovalencia · FGV</text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="270" x2="944" y2="270" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Bottom section: left text, right badge -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" fill-opacity="0.45">Plan your journey · Save favorite routes · Real line colors · Transfer buffer · Dark mode</text>

  <!-- Google Play badge -->
  <g transform="translate(814, 295)">
    <rect x="0" y="0" width="160" height="52" rx="10" fill="#000000" fill-opacity="0.6"/>
    <text x="80" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">GET IT ON</text>
    <text x="80" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google Play</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="470" width="1024" height="30" fill="#000000" fill-opacity="0.2"/>
  <text x="512" y="490" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" fill-opacity="0.35" text-anchor="middle">Free and open source software · AGPL-3.0 · github.com/IgnacioLD/TransitOS</text>
</svg>
