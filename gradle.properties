# JVM args for the Gradle daemon — tuned for Kotlin/Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Run independent modules in parallel.
org.gradle.parallel=true

# Cache between builds.
org.gradle.caching=true

# Configure on demand — smaller incremental builds for our module graph.
org.gradle.configureondemand=true

# Kotlin code style.
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress unsupported compiler warnings until AGP catches up.
android.suppressUnsupportedCompileSdk=34
