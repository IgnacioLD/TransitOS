name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  dco:
    name: "Signed-off-by (DCO)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          rc=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <[^ ]+@[^ ]+>'; then
              echo "::error file=commit::Commit ${sha:0:9} is missing a Signed-off-by line. Add it with: git commit -s (see .github/DCO.md)"
              rc=1
            fi
          done < <(git rev-list "${base}..HEAD")
          if [ "$rc" -ne 0 ]; then
            echo "To fix existing commits: git rebase --signoff ${BASE_REF} && git push --force-with-lease"
            exit "$rc"
          fi
          echo "All commits are signed off."
